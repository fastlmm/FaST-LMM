[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "fastlmm"
version = "0.6.13"
description = "Fast GWAS"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "gwas",
    "bioinformatics",
    "LMMs",
    "MLMs",
    "linear",
    "mixed models",
    "genomics",
    "genetics",
    "python",
]
authors = [{ name = "FaST-LMM Team", email = "fastlmm-dev@python.org" }]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.22.0; python_version < '3.14'",
    "numpy>=2.3.5; python_version >= '3.14'",
    "scipy>=1.8.0; python_version < '3.14'",
    "scipy>=1.16.1; python_version >= '3.14'",
    "pandas>=1.3.1,<4; python_version < '3.14'",
    "pandas>=2.3.3,<4; python_version >= '3.14'",
    "matplotlib>=3.8.0; python_version < '3.14'",
    "matplotlib>=3.10.5; python_version >= '3.14'",
    "scikit-learn>=1.4.2; python_version < '3.14'",
    "scikit-learn>=1.7.2; python_version >= '3.14'",
    "cloudpickle>=3.1.0; python_version < '3.14'",
    "cloudpickle>=3.1.1; python_version >= '3.14'",
    "statsmodels>=0.14.2; python_version < '3.14'",
    "statsmodels>=0.14.5; python_version >= '3.14'",
    "psutil>=6.1.0; python_version < '3.14'",
    "psutil>=7.1.2; python_version >= '3.14'",
    "pysnptools>=0.5.15",
    "fastlmmclib>=0.0.8",
]
[project.urls]
Homepage = "https://fastlmm.github.io/"
Documentation = "https://fastlmm.github.io/FaST-LMM"
Issues = "https://github.com/fastlmm/FaST-LMM/issues"
Source = "https://github.com/fastlmm/FaST-LMM"

[project.optional-dependencies]
bgen = ["cbgen>=1.0.6", "bgen-reader>=4.0.9"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-datadir",
    "limix-sphinx-theme>=0.0.4",
    "pytest-sphinx>=0.2.2",
    "sphinx>=6.2.1",
    "sphinx_rtd_theme>=0.4.3",
    "ruff>=0.1.0",
]


[tool.ruff]
line-length = 250
exclude = [
    "*.ipynb",
    "doc/source/conf.py",
    "bed_reader/tests/benchmark/benchmark.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F403", "F405"]


[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob=*.rst --doctest-glob=*.md"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
filterwarnings = [
    "ignore:Converting float64 to float32 can cause loss of information:UserWarning",
    "ignore:'count_A1' was not set.*will default to 'False':FutureWarning",
    "ignore:standardizing an ndarray instead of a SnpData is deprecated:DeprecationWarning",
    "ignore:.*\\.kernel.*deprecated.*read_kernel.*val:DeprecationWarning",
    "ignore:'parent_string' is deprecated. Use 'name':DeprecationWarning",
]

[dependency-groups]
dev = ["pytest-xdist>=3.6.1", "twine>=5.1.1"]
notebook = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "nbconvert>=7.17.1",
]


[tool.uv.build-backend]
module-name = "fastlmm"
module-root = ""
source-include = ["AUTHORS.txt"]
source-exclude = [
    "/fastlmm/**/.working/**",
    "/fastlmm/**/*.pyproj",
    "/fastlmm/**/*.sln",
    "/fastlmm/association/Fastlmm_autoselect/bypass/**",
    "/fastlmm/association/sampleInput.txt",
    "/fastlmm/association/setthreads.bat",
    "/fastlmm/association/testcp50K5K.profile",
    "/fastlmm/feature_selection/examples/test_snps.txt",
    "/fastlmm/feature_selection/examples/toydata.dat",
    "/fastlmm/feature_selection/examples/toydata.fam",
    "/fastlmm/feature_selection/examples/toydata.iidmajor.hdf5",
    "/fastlmm/feature_selection/examples/toydata.ped",
    "/fastlmm/feature_selection/examples/toydata.snpmajor.hdf5",
    "/fastlmm/ludicrous2/**",
    "/fastlmm/pyplink/chr22.small.vcf",
    "/fastlmm/pyplink/testdata/**",
]
wheel-exclude = [
    "/fastlmm/**/.working/**",
    "/fastlmm/**/*.pyproj",
    "/fastlmm/**/*.sln",
    "/fastlmm/association/Fastlmm_autoselect/bypass/**",
    "/fastlmm/association/sampleInput.txt",
    "/fastlmm/association/setthreads.bat",
    "/fastlmm/association/testcp50K5K.profile",
    "/fastlmm/feature_selection/examples/test_snps.txt",
    "/fastlmm/feature_selection/examples/toydata.dat",
    "/fastlmm/feature_selection/examples/toydata.fam",
    "/fastlmm/feature_selection/examples/toydata.iidmajor.hdf5",
    "/fastlmm/feature_selection/examples/toydata.ped",
    "/fastlmm/feature_selection/examples/toydata.snpmajor.hdf5",
    "/fastlmm/ludicrous2/**",
    "/fastlmm/pyplink/chr22.small.vcf",
    "/fastlmm/pyplink/testdata/**",
]
