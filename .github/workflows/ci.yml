name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true

      - name: Ruff
        run: uvx ruff@0.7.1 check

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: documentation

      - name: Install documentation dependencies
        run: uv sync --frozen --extra dev

      - name: Build documentation from clean sources
        run: uv run --frozen --no-sync sphinx-build -W --keep-going -E -a -d "${{ runner.temp }}/doctrees" -b html doc/source "${{ runner.temp }}/generated-docs"

      - name: Verify generated documentation is current
        run: diff -ru --exclude=.nojekyll "${{ runner.temp }}/generated-docs" docs

  minimum-dependencies:
    name: Minimum dependencies (Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: minimum-${{ matrix.python-version }}

      - name: Install declared direct dependency minimums
        run: |
          uv venv --python ${{ matrix.python-version }} .minimum-venv
          uv pip install --python .minimum-venv/bin/python --resolution lowest-direct --editable ".[bgen]"

      - name: Run the canonical suite
        working-directory: tests
        run: ../.minimum-venv/bin/python test.py

  dependency-freshness:
    name: Latest stable dependencies (Python 3.14)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: freshness-3.14

      - name: Resolve latest stable dependencies
        run: uv lock --upgrade

      - name: Install the refreshed environment
        run: uv sync --all-extras

      - name: Run the canonical suite
        working-directory: tests
        run: uv run --no-sync python test.py

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15-intel, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install all test dependencies
        run: uv sync --frozen --all-extras

      - name: Run the canonical suite
        working-directory: tests
        run: uv run --frozen --no-sync python test.py

  build:
    name: Build distributions
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true

      - name: Verify the lockfile
        run: uv lock --check

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Build wheel from the source distribution
        run: uv build --wheel --no-sources --out-dir sdist-dist dist/*.tar.gz

      - name: Compare direct and sdist-derived wheels
        shell: bash
        run: cmp dist/*.whl sdist-dist/*.whl

      - name: Upload distributions and smoke test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            tests/artifact_smoke_test.py
          if-no-files-found: error
          retention-days: 7

  artifact-test:
    name: Artifact test (${{ matrix.kind }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: wheel
            python-version: "3.10"
            package: artifact/dist/*.whl
          - kind: sdist
            python-version: "3.10"
            package: artifact/dist/*.tar.gz
          - kind: wheel
            python-version: "3.14"
            package: artifact/dist/*.whl
          - kind: sdist
            python-version: "3.14"
            package: artifact/dist/*.tar.gz
    steps:
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          no-project: true
          enable-cache: false

      - name: Download distributions and smoke test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifact

      - name: Create clean environment
        run: uv venv --python ${{ matrix.python-version }} .artifact-venv

      - name: Install exact ${{ matrix.kind }} artifact
        run: uv pip install --python .artifact-venv/bin/python ${{ matrix.package }}

      - name: Smoke-test installed package
        run: .artifact-venv/bin/python artifact/tests/artifact_smoke_test.py
